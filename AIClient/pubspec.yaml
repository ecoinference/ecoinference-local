name: ai_client
description: Gemma 4 client — connects to the local inference server (AIServer).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP client (pinned upper bound — ResponseType.stream API can change in minors)
  dio: '>=5.4.3 <6.0.0'
  # Persist server config and chat history
  shared_preferences: ^2.2.3
  # Start/stop AIServerAndroid via explicit Intent (Android only — no-op on iOS)
  android_intent_plus: '>=4.0.0 <5.0.0'
  # Open HuggingFace licence pages in the device browser
  url_launcher: ^6.2.0
  # ── Agentic hardware tools ────────────────────────────────────────────────
  # Flashlight / torch control
  torch_light: ^1.0.0
  # Runtime permission requests (camera required for torch on Android)
  permission_handler: ^11.3.0
  # GPS location
  geolocator: ^13.0.0
  # Battery level for device context injection
  battery_plus: ^6.0.0
  # Network connectivity type for device context injection
  connectivity_plus: ^6.0.0
  # WebView for Pyodide Python runner
  webview_flutter: ^4.7.0
  # Image picker for camera / gallery attachment to chat messages
  image_picker: ^1.0.7
  # ── Voice I/O ─────────────────────────────────────────────────────────────
  # Speech-to-text (mic input)
  speech_to_text: ^7.4.0
  # Text-to-speech (auto-read responses)
  flutter_tts: ^4.0.0
  # ── Deep links ────────────────────────────────────────────────────────────
  # Receive aiclient:// URL scheme on both iOS and Android
  app_links: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/python_runner.html
    - assets/images/eco_icon.png
