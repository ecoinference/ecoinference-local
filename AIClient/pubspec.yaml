name: ai_client
description: Gemma 4 client — connects to the local inference server (AIServer).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP client (pinned upper bound — ResponseType.stream API can change in minors)
  dio: '>=5.4.3 <6.0.0'
  # Persist server config and chat history
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
