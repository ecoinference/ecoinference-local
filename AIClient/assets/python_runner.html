<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>body { margin: 0; background: transparent; }</style>
</head>
<body>
<script>
// ── Package registry ──────────────────────────────────────────────────────────
const PACKAGE_MAP = {
  'numpy':      { pkg: 'numpy',      via: 'pyodide' },
  'np':         { pkg: 'numpy',      via: 'pyodide' },
  'pandas':     { pkg: 'pandas',     via: 'pyodide' },
  'pd':         { pkg: 'pandas',     via: 'pyodide' },
  'scipy':      { pkg: 'scipy',      via: 'pyodide' },
  'matplotlib': { pkg: 'matplotlib', via: 'pyodide' },
  'plt':        { pkg: 'matplotlib', via: 'pyodide' },
  'plotly':     { pkg: 'plotly',     via: 'micropip' },
  'px':         { pkg: 'plotly',     via: 'micropip' },
  'go':         { pkg: 'plotly',     via: 'micropip' },
  'ff':         { pkg: 'plotly',     via: 'micropip' },
  'astral':     { pkg: 'astral',     via: 'micropip' },
  'folium':     { pkg: 'folium',     via: 'micropip' },
  'shapely':    { pkg: 'shapely',    via: 'pyodide'  },
};

const loadedPkgs = new Set();
let pyodide = null;

// ── Timeout helper ────────────────────────────────────────────────────────────
// Races a promise against a rejection timer so every network call has a ceiling.
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error(label + ' timed out after ' + (ms / 1000) + 's')), ms)
    )
  ]);
}

// ── Initialise Pyodide ────────────────────────────────────────────────────────
async function initPyodide() {
  try {
    await withTimeout(
      new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('Failed to load Pyodide CDN script'));
        document.head.appendChild(s);
      }),
      30000, 'Pyodide CDN script load'
    );

    pyodide = await withTimeout(loadPyodide(), 45000, 'loadPyodide()');
    // micropip: package installer; tzdata: required by zoneinfo on Pyodide
    await withTimeout(pyodide.loadPackage(['micropip', 'tzdata']), 30000, 'micropip + tzdata load');

    // Pre-configure matplotlib non-interactive backend + capture helpers
    await pyodide.runPythonAsync(`
import os, sys, io as _sysio
os.environ['MPLBACKEND'] = 'Agg'

def _capture_mpl_figure():
    """Auto-export the current matplotlib figure as a PNG data URL, or return None."""
    try:
        import matplotlib.pyplot as _plt
        if not _plt.get_fignums():
            return None
        import io as _io, base64 as _b64
        _buf = _io.BytesIO()
        _plt.gcf().savefig(_buf, format='png', bbox_inches='tight', dpi=150)
        _plt.close('all')
        _buf.seek(0)
        return 'data:image/png;base64,' + _b64.b64encode(_buf.read()).decode()
    except Exception:
        return None

def _capture_plotly_figure():
    """Scan globals for any Plotly Figure and return self-contained HTML, or return None."""
    try:
        import plotly.basedatatypes as _pbt
        for _v in reversed(list(globals().values())):
            if isinstance(_v, _pbt.BaseFigure):
                return _v.to_html(include_plotlyjs='cdn', full_html=True)
    except Exception:
        return None
    return None
`);

    PythonResult.postMessage(JSON.stringify({ type: 'ready' }));
  } catch (err) {
    PythonResult.postMessage(JSON.stringify({
      type: 'error',
      value: 'Pyodide init failed: ' + err.toString()
    }));
  }
}

// ── Smart package loader ──────────────────────────────────────────────────────
async function loadRequiredPackages(code) {
  const pyodideQueue = [];
  const micropipQueue = [];

  for (const [alias, info] of Object.entries(PACKAGE_MAP)) {
    if (loadedPkgs.has(info.pkg)) continue;
    if (
      code.includes('import ' + alias) ||
      code.includes('from ' + alias + ' ') ||
      code.includes('from ' + alias + '.')
    ) {
      info.via === 'pyodide'
        ? pyodideQueue.push(info.pkg)
        : micropipQueue.push(info.pkg);
      loadedPkgs.add(info.pkg);
    }
  }

  if (pyodideQueue.length > 0) {
    const names = [...new Set(pyodideQueue)];
    PythonResult.postMessage(JSON.stringify({
      type: 'status',
      value: 'Loading ' + names.join(', ') + '…'
    }));
    await withTimeout(
      pyodide.loadPackage(names),
      30000, 'loadPackage(' + names.join(',') + ')'
    );
  }

  if (micropipQueue.length > 0) {
    const micropip = pyodide.pyimport('micropip');
    for (const pkg of [...new Set(micropipQueue)]) {
      PythonResult.postMessage(JSON.stringify({
        type: 'status',
        value: 'Installing ' + pkg + '…'
      }));
      await withTimeout(micropip.install(pkg), 30000, 'micropip.install(' + pkg + ')');
    }
  }
}

// ── Classify and post a result string ────────────────────────────────────────
function postResult(value) {
  const s = value.trim();
  if (s.startsWith('data:image/')) {
    PythonResult.postMessage(JSON.stringify({ type: 'image', value: s }));
  } else if (s.startsWith('<!DOCTYPE') || s.startsWith('<html')) {
    PythonResult.postMessage(JSON.stringify({ type: 'html', value: s }));
  } else {
    PythonResult.postMessage(JSON.stringify({ type: 'text', value: s }));
  }
}

// ── Execute ───────────────────────────────────────────────────────────────────
async function runPython(code) {
  if (!pyodide) {
    PythonResult.postMessage(JSON.stringify({ type: 'error', value: 'Pyodide not ready yet.' }));
    return;
  }

  // Race the whole execution against a 55 s wall-clock timeout so network
  // hangs (package installs, slow CDN) always resolve before Dart's 60 s limit.
  const execPromise = (async () => {
    await loadRequiredPackages(code);

    // Redirect stdout so print() calls are captured
    await pyodide.runPythonAsync(`
import sys, io as _sysio
_stdout_buf = _sysio.StringIO()
sys.stdout = _stdout_buf
`);

    // Clear previous result and any stale Plotly figures from prior runs.
    await pyodide.runPythonAsync("globals().pop('result', None)");
    if (loadedPkgs.has('plotly')) {
      await pyodide.runPythonAsync(`
try:
    import plotly.basedatatypes as _pbt
    for _k in [k for k, v in globals().items() if isinstance(v, _pbt.BaseFigure)]:
        del globals()[_k]
except Exception:
    pass
`);
    }

    // Run user code; runPythonAsync returns the last expression value (REPL-style).
    let lastExprValue;
    try {
      lastExprValue = await pyodide.runPythonAsync(code);
    } finally {
      // Always restore stdout
      await pyodide.runPythonAsync("sys.stdout = sys.__stdout__");
    }

    // Collect captured stdout
    const stdoutProxy = pyodide.globals.get('_stdout_buf');
    const stdout = stdoutProxy ? stdoutProxy.getvalue() : '';
    if (stdoutProxy && stdoutProxy.destroy) stdoutProxy.destroy();

    // ── Resolve result ────────────────────────────────────────────────────────
    // Priority order:
    //   1. result = <image data URL or full HTML>  — explicit rich output (folium, plotly to_html)
    //   2. matplotlib auto-capture                 — open figure → PNG
    //   3. plotly auto-capture                     — BaseFigure in globals → HTML
    //   4. last expression value                   — REPL-style
    //   5. stdout                                  — print() output
    //   6. result = <plain text>                   — fallback so "done" strings don't
    //                                                 block image/HTML capture above
    //   7. error — no output produced
    const resultProxy = pyodide.globals.get('result');
    let explicitText = null;

    if (resultProxy !== undefined && resultProxy !== null) {
      const s = typeof resultProxy.toString === 'function'
        ? resultProxy.toString()
        : String(resultProxy);
      if (resultProxy.destroy) resultProxy.destroy();

      const trimmed = s.trim();
      if (trimmed.startsWith('data:image/') ||
          trimmed.startsWith('<!DOCTYPE') ||
          trimmed.startsWith('<html')) {
        // 1. Rich explicit result — use immediately
        postResult(s);
        return;
      }
      // Plain text — save for step 6 so auto-capture can fire first
      explicitText = s;
    }

    // 2. Auto-capture: open matplotlib figure
    const mplProxy = await pyodide.runPythonAsync('_capture_mpl_figure()');
    if (mplProxy !== null && mplProxy !== undefined) {
      const s = typeof mplProxy.toString === 'function' ? mplProxy.toString() : String(mplProxy);
      if (mplProxy.destroy) mplProxy.destroy();
      if (s.startsWith('data:image/')) { postResult(s); return; }
    }

    // 3. Auto-capture: Plotly figure in globals
    if (loadedPkgs.has('plotly')) {
      const plotlyProxy = await pyodide.runPythonAsync('_capture_plotly_figure()');
      if (plotlyProxy !== null && plotlyProxy !== undefined) {
        const s = typeof plotlyProxy.toString === 'function' ? plotlyProxy.toString() : String(plotlyProxy);
        if (plotlyProxy.destroy) plotlyProxy.destroy();
        if (s.startsWith('<!DOCTYPE') || s.startsWith('<html')) { postResult(s); return; }
      }
    }

    // 4. Auto-capture: last expression value from runPythonAsync
    if (lastExprValue !== null && lastExprValue !== undefined) {
      const s = typeof lastExprValue.toString === 'function'
        ? lastExprValue.toString()
        : String(lastExprValue);
      if (lastExprValue.destroy) lastExprValue.destroy();
      if (s.trim().length > 0 && s !== 'None') { postResult(s); return; }
    }

    // 5. Auto-capture: stdout (from print() calls)
    if (stdout && stdout.trim().length > 0) {
      postResult(stdout.trim());
      return;
    }

    // 6. Explicit plain-text result (fallback — after auto-capture so a
    //    "Plot generated successfully" string doesn't block image/HTML output)
    if (explicitText !== null && explicitText.trim().length > 0) {
      postResult(explicitText);
      return;
    }

    // 7. Nothing to return
    PythonResult.postMessage(JSON.stringify({
      type: 'error',
      value: "Code ran but produced no output. Assign the answer to 'result', e.g. result = 42"
    }));
  })();

  try {
    await withTimeout(execPromise, 55000, 'Python execution');
  } catch (err) {
    // Always attempt stdout restore on any error / timeout
    try { await pyodide.runPythonAsync("import sys; sys.stdout = sys.__stdout__"); } catch (_) {}
    PythonResult.postMessage(JSON.stringify({ type: 'error', value: err.toString() }));
  }
}

initPyodide();
</script>
</body>
</html>
