name: AIiOS
options:
  bundleIdPrefix: ai.ecoinference
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

# Local.xcconfig is gitignored — copy Local.xcconfig.sample → Local.xcconfig
# and fill in HF_TOKEN before building. setup.sh creates an empty one automatically.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

packages:
  PythonKit:
    url: https://github.com/pvieito/PythonKit
    branch: master

settings:
  base:
    SWIFT_VERSION: "5.10"
    # DEVELOPMENT_TEAM: "XXXXXXXXXX"   ← uncomment and set your 10-char Team ID
    #                                    before archiving for distribution.
    #                                    Leave commented for local device builds —
    #                                    Xcode auto-assigns from your account.
    SWIFT_OBJC_BRIDGING_HEADER: AIiOS/LiteRtLm-Bridging-Header.h
    OTHER_LDFLAGS:
      - "-rpath"
      - "@executable_path/Frameworks"
    # Required for PythonKit / BeeWare embedded Python
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  AIiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    info:
      path: AIiOS/Info.plist
      properties:
        # URL scheme so AIClient can launch/stop this app via aiserver://start|stop
        CFBundleURLTypes:
          - CFBundleURLName: ai.ecoinference.app
            CFBundleURLSchemes:
              - ecoinference
        # Keep NWListener alive when backgrounded via silent AVAudioSession.
        # Without this iOS suspends the app and HTTP clients get no response.
        UIBackgroundModes:
          - audio
        # ── PERMANENT FULL-SCREEN FIX (do not remove) ────────────────────────
        # Without UIRequiresFullScreen + UILaunchScreen, iOS 26 runs the app in
        # a 320×480 legacy compatibility window and upscales it, producing solid
        # black bars at the Dynamic Island (top ~59pt) and home indicator
        # (bottom ~34pt) on iPhone 15 Pro.  These two keys force full-screen mode.
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # App icon (actool excluded at build time; icon PNGs copied manually)
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            CFBundleIconName: AppIcon
        "CFBundleIcons~ipad":
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            CFBundleIconName: AppIcon
        # Privacy usage descriptions required by iOS
        NSLocationWhenInUseUsageDescription: "EcoInference uses your location to answer location-aware queries."
        NSCameraUsageDescription: "EcoInference uses the camera to attach images to your messages."
        NSPhotoLibraryUsageDescription: "EcoInference reads photos you choose to attach to messages."

    entitlements:
      path: AIiOS/AIiOS.entitlements

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ecoinference.app
        PRODUCT_NAME: EcoInference
        INFOPLIST_FILE: AIiOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: AIiOS/AIiOS.entitlements
        DEVELOPMENT_TEAM: 65P94N4JDC
        CODE_SIGN_STYLE: Automatic

    sources:
      - path: AIiOS
        excludes:
          - "**/*.md"

    dependencies:
      # LiteRT-LM dylibs — built into xcframeworks by download_frameworks.sh
      - framework: Frameworks/libLiteRtLm.xcframework
        embed: true
      - framework: Frameworks/libGemmaModelConstraintProvider.xcframework
        embed: true
      - framework: Frameworks/libLiteRtMetalAccelerator.xcframework
        embed: true
      - framework: Frameworks/libStreamProxy.xcframework
        embed: true
      # BeeWare Python.xcframework (CPython 3.12 for iOS)
      - framework: Python.xcframework
        embed: true
      # PythonKit — Swift wrapper over the Python C API
      - package: PythonKit

    preBuildScripts:
      - name: "Install Python stdlib + convert .so → .framework"
        script: |
          set -e
          source "${PROJECT_DIR}/Python.xcframework/build/utils.sh"

          # Sync app code and packages into the bundle
          mkdir -p "${CODESIGNING_FOLDER_PATH}/app_packages"
          rsync -au --delete "${PROJECT_DIR}/app_packages/" "${CODESIGNING_FOLDER_PATH}/app_packages/"
          mkdir -p "${CODESIGNING_FOLDER_PATH}/app"
          rsync -au "${PROJECT_DIR}/app/" "${CODESIGNING_FOLDER_PATH}/app/"

          # Install stdlib and convert binary .so extensions → .framework
          install_python Python.xcframework app_packages
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
