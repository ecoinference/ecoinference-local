name: app1
description: Gemma 4 on-device inference server with REST API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP server
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  # Downloads
  dio: ^5.4.3
  # Storage
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  # Checksum verification
  crypto: ^3.0.3
  # Permissions (Android storage)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
