[versions]
agp                  = "8.5.2"
kotlin               = "2.3.21"
coreKtx              = "1.15.0"
coroutines           = "1.11.0"
okhttp               = "4.12.0"
litertlm             = "0.12.0"
datastore            = "1.1.1"
serialization        = "1.11.0"
composeBom           = "2024.09.00"
lifecycleVm          = "2.8.7"
activityCompose      = "1.9.3"
coil                 = "2.7.0"
accompanistPermissions = "0.36.0"
playServicesLocation = "21.3.0"

[libraries]
androidx-core-ktx                  = { group = "androidx.core",            name = "core-ktx",                       version.ref = "coreKtx"           }
kotlinx-coroutines-android         = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",     version.ref = "coroutines"        }
kotlinx-serialization-json         = { group = "org.jetbrains.kotlinx",    name = "kotlinx-serialization-json",     version.ref = "serialization"     }
okhttp                             = { group = "com.squareup.okhttp3",      name = "okhttp",                         version.ref = "okhttp"            }
litertlm-android                   = { group = "com.google.ai.edge.litertlm", name = "litertlm-android",            version.ref = "litertlm"          }
datastore-preferences              = { group = "androidx.datastore",        name = "datastore-preferences",          version.ref = "datastore"         }
compose-bom                        = { group = "androidx.compose",          name = "compose-bom",                    version.ref = "composeBom"        }
compose-ui                         = { group = "androidx.compose.ui",       name = "ui"                                                                }
compose-ui-graphics                = { group = "androidx.compose.ui",       name = "ui-graphics"                                                       }
compose-ui-tooling-preview         = { group = "androidx.compose.ui",       name = "ui-tooling-preview"                                                }
compose-ui-tooling                 = { group = "androidx.compose.ui",       name = "ui-tooling"                                                        }
compose-material3                  = { group = "androidx.compose.material3",name = "material3"                                                         }
compose-material-icons-extended    = { group = "androidx.compose.material", name = "material-icons-extended"                                           }
lifecycle-viewmodel-ktx            = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-ktx",        version.ref = "lifecycleVm"       }
lifecycle-viewmodel-compose        = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",    version.ref = "lifecycleVm"       }
lifecycle-runtime-compose          = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",      version.ref = "lifecycleVm"       }
activity-compose                   = { group = "androidx.activity",         name = "activity-compose",               version.ref = "activityCompose"   }
coil-compose                       = { group = "io.coil-kt",                name = "coil-compose",                   version.ref = "coil"              }
accompanist-permissions            = { group = "com.google.accompanist",    name = "accompanist-permissions",        version.ref = "accompanistPermissions" }
play-services-location             = { group = "com.google.android.gms",    name = "play-services-location",         version.ref = "playServicesLocation" }

[plugins]
android-application  = { id = "com.android.application",                    version.ref = "agp"    }
kotlin-android       = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
