<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>body { margin: 0; background: transparent; }</style>
</head>
<body>
<script>
// ── Package registry ──────────────────────────────────────────────────────────
const PACKAGE_MAP = {
  'numpy':      { pkg: 'numpy',      via: 'pyodide' },
  'np':         { pkg: 'numpy',      via: 'pyodide' },
  'pandas':     { pkg: 'pandas',     via: 'pyodide' },
  'pd':         { pkg: 'pandas',     via: 'pyodide' },
  'scipy':      { pkg: 'scipy',      via: 'pyodide' },
  'matplotlib': { pkg: 'matplotlib', via: 'pyodide' },
  'plt':        { pkg: 'matplotlib', via: 'pyodide' },
  'plotly':     { pkg: 'plotly',     via: 'micropip' },
  'px':         { pkg: 'plotly',     via: 'micropip' },
  'go':         { pkg: 'plotly',     via: 'micropip' },
  'ff':         { pkg: 'plotly',     via: 'micropip' },
  'astral':     { pkg: 'astral',     via: 'micropip' },
  'folium':     { pkg: 'folium',     via: 'micropip' },
  'shapely':    { pkg: 'shapely',    via: 'pyodide'  },
};

const loadedPkgs = new Set();
let pyodide = null;

// ── Android bridge ────────────────────────────────────────────────────────────
// AndroidBridge is injected by Kotlin via addJavascriptInterface().
function postResult(json) {
  if (window.AndroidBridge) {
    AndroidBridge.postMessage(json);
  }
}

// ── Timeout helper ─────────────────────────────────────────────────────────────
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error(label + ' timed out after ' + (ms / 1000) + 's')), ms)
    )
  ]);
}

// ── Initialise Pyodide ────────────────────────────────────────────────────────
async function initPyodide() {
  try {
    await withTimeout(
      new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('Failed to load Pyodide CDN script'));
        document.head.appendChild(s);
      }),
      30000, 'Pyodide CDN script load'
    );

    pyodide = await withTimeout(loadPyodide(), 45000, 'loadPyodide()');
    await withTimeout(pyodide.loadPackage(['micropip', 'tzdata']), 30000, 'micropip + tzdata load');

    // Pre-configure matplotlib + capture helpers
    await pyodide.runPythonAsync(`
import os, sys, io as _sysio
os.environ['MPLBACKEND'] = 'Agg'

def _capture_mpl_figure():
    try:
        import matplotlib.pyplot as _plt
        if not _plt.get_fignums():
            return None
        import io as _io, base64 as _b64
        _buf = _io.BytesIO()
        _plt.gcf().savefig(_buf, format='png', bbox_inches='tight', dpi=150)
        _plt.close('all')
        _buf.seek(0)
        return 'data:image/png;base64,' + _b64.b64encode(_buf.read()).decode()
    except Exception:
        return None

def _capture_plotly_figure():
    try:
        import plotly.basedatatypes as _pbt
        for _v in reversed(list(globals().values())):
            if isinstance(_v, _pbt.BaseFigure):
                return _v.to_html(include_plotlyjs='cdn', full_html=True)
    except Exception:
        return None
    return None
`);

    postResult(JSON.stringify({ type: 'ready' }));
  } catch (err) {
    postResult(JSON.stringify({ type: 'error', value: 'Pyodide init failed: ' + err.toString() }));
  }
}

// ── Execute Python code (called by Kotlin via evaluateJavascript) ──────────────
// Code is passed as base64 to avoid JS escaping issues.
async function runPythonB64(b64) {
  const code = atob(b64);
  await runPython(code);
}

async function runPython(code) {
  if (!pyodide) {
    postResult(JSON.stringify({ type: 'error', value: 'Pyodide not ready yet' }));
    return;
  }

  const execPromise = (async () => {
    // ── Auto-load imported packages ─────────────────────────────────────────
    const importRe = /(?:^|\n)\s*(?:import|from)\s+([A-Za-z_][A-Za-z0-9_]*)/g;
    let m;
    const toLoad = { pyodide: [], micropip: [] };
    while ((m = importRe.exec(code)) !== null) {
      const alias = m[1];
      const entry = PACKAGE_MAP[alias];
      if (entry && !loadedPkgs.has(entry.pkg)) {
        toLoad[entry.via].push(entry.pkg);
        loadedPkgs.add(entry.pkg);
      }
    }
    if (toLoad.pyodide.length > 0)
      await withTimeout(pyodide.loadPackage(toLoad.pyodide), 30000, 'loadPackage ' + toLoad.pyodide);
    if (toLoad.micropip.length > 0) {
      const micropip = pyodide.pyimport('micropip');
      for (const pkg of toLoad.micropip)
        await withTimeout(micropip.install(pkg), 30000, 'micropip.install ' + pkg);
    }

    // ── Capture stdout via StringIO ─────────────────────────────────────────
    await pyodide.runPythonAsync(`
import sys, io as _io
_stdout_buf = _io.StringIO()
sys.stdout = _stdout_buf
`);

    let lastExprValue = null;
    try {
      lastExprValue = await pyodide.runPythonAsync(code);
    } finally {
      await pyodide.runPythonAsync('sys.stdout = sys.__stdout__');
    }

    const stdoutProxy = pyodide.globals.get('_stdout_buf');
    const stdout = stdoutProxy ? stdoutProxy.getvalue() : '';
    if (stdoutProxy && stdoutProxy.destroy) stdoutProxy.destroy();

    // ── Resolve result (priority order) ────────────────────────────────────
    // 1. explicit rich result (data URL or HTML)
    // 2. matplotlib auto-capture
    // 3. plotly auto-capture
    // 4. last expression value
    // 5. stdout
    // 6. explicit plain-text result
    // 7. error — nothing produced

    const resultProxy = pyodide.globals.get('result');
    let explicitText = null;

    if (resultProxy !== undefined && resultProxy !== null) {
      const s = typeof resultProxy.toString === 'function'
        ? resultProxy.toString() : String(resultProxy);
      if (resultProxy.destroy) resultProxy.destroy();
      const trimmed = s.trim();
      if (trimmed.startsWith('data:image/') || trimmed.startsWith('<!DOCTYPE') || trimmed.startsWith('<html')) {
        postResult(JSON.stringify({ type: 'result', value: s }));
        return;
      }
      explicitText = s;
    }

    // 2. matplotlib
    const mplProxy = await pyodide.runPythonAsync('_capture_mpl_figure()');
    if (mplProxy !== null && mplProxy !== undefined) {
      const s = typeof mplProxy.toString === 'function' ? mplProxy.toString() : String(mplProxy);
      if (mplProxy.destroy) mplProxy.destroy();
      if (s.startsWith('data:image/')) { postResult(JSON.stringify({ type: 'result', value: s })); return; }
    }

    // 3. plotly
    if (loadedPkgs.has('plotly')) {
      const plotlyProxy = await pyodide.runPythonAsync('_capture_plotly_figure()');
      if (plotlyProxy !== null && plotlyProxy !== undefined) {
        const s = typeof plotlyProxy.toString === 'function' ? plotlyProxy.toString() : String(plotlyProxy);
        if (plotlyProxy.destroy) plotlyProxy.destroy();
        if (s.startsWith('<!DOCTYPE') || s.startsWith('<html')) { postResult(JSON.stringify({ type: 'result', value: s })); return; }
      }
    }

    // 4. last expression value
    if (lastExprValue !== null && lastExprValue !== undefined) {
      const s = typeof lastExprValue.toString === 'function' ? lastExprValue.toString() : String(lastExprValue);
      if (lastExprValue.destroy) lastExprValue.destroy();
      if (s.trim().length > 0 && s !== 'None') { postResult(JSON.stringify({ type: 'result', value: s })); return; }
    }

    // 5. stdout
    if (stdout && stdout.trim().length > 0) {
      postResult(JSON.stringify({ type: 'result', value: stdout.trim() }));
      return;
    }

    // 6. plain-text explicit result
    if (explicitText !== null && explicitText.trim().length > 0) {
      postResult(JSON.stringify({ type: 'result', value: explicitText }));
      return;
    }

    // 7. nothing
    postResult(JSON.stringify({
      type: 'error',
      value: "Code ran but produced no output. Assign the answer to 'result', e.g. result = 42"
    }));
  })();

  try {
    await withTimeout(execPromise, 55000, 'Python execution');
  } catch (err) {
    try { await pyodide.runPythonAsync('import sys; sys.stdout = sys.__stdout__'); } catch (_) {}
    postResult(JSON.stringify({ type: 'error', value: err.toString() }));
  }
}

initPyodide();
</script>
</body>
</html>
