name: ai_server
description: Gemma 4 on-device inference server with REST API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # On-device Gemma inference — pinned to avoid breaking changes before 1.0
  flutter_gemma: '>=0.13.6 <0.14.0'
  # HTTP server
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  # Downloads (pinned upper bound — ResponseType.stream API can change in minors)
  dio: '>=5.4.3 <6.0.0'
  # Storage
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
