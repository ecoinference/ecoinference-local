plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.gemma4.aiserver"
    compileSdk 36
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "com.gemma4.aiserver"
        minSdk 26          // Google AI Edge LLM Inference requires API 26+
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

flutter {
    source "../.."
}

// flutter_gemma bundles MediaPipe tasks-genai 0.10.33 and LiteRT-LM
// automatically — do NOT add a separate tasks-genai dependency here as
// duplicate versions cause version-conflict build errors.
