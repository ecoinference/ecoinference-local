plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.gemma4.aiserver"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.gemma4.aiserver"
        minSdk 26          // Google AI Edge LLM Inference requires API 26+
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

// Force litertlm-android to 0.10.2 — flutter_gemma 0.13.6 bundles 0.10.0
// which predates Gemma 4 support. 0.10.1+ is required for .litertlm files
// generated with the Gemma 4 model format.
configurations.all {
    resolutionStrategy.force 'com.google.ai.edge.litertlm:litertlm-android:0.10.2'
}
